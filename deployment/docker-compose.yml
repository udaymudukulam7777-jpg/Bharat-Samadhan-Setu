version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deployment/docker/backend.Dockerfile
    container_name: jharkhand_samadhan_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - AI_MODE=mock
      - DATABASE_URL=sqlite:///./jharkhand_samadhan.db
      - JWT_SECRET=jharkhand_sih_2026_super_secret_jwt_key_998877
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/docker/frontend.Dockerfile
    container_name: jharkhand_samadhan_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_db:
